# Databricks Asset Bundle Configuration
# Unified Job Platform: Job Monitoring
bundle:
  name: unified-job-platform

variables:
  catalog:
    description: "Unity Catalog name (e.g. 'main' or your custom catalog)"
    default: "main"
  schema:
    description: "Schema for materialized views and synced tables"
    default: "job_monitoring"
  warehouse_id:
    description: "SQL Warehouse ID for queries (required)"
    default: ""
  genie_space_id:
    description: "Genie Space ID for AI assistant (optional)"
    default: ""
  lakebase_instance_name:
    description: "Lakebase instance name (optional)"
    default: ""
  service_principal_name:
    description: "Service principal name for production run_as (required for prod target)"
    default: ""

include:
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/dev

  staging:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/staging

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Applications/${bundle.name}
    run_as:
      service_principal_name: ${var.service_principal_name}
